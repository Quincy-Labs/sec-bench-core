[project]
name = "sec-bench-core"
version = "0.2.0"
description = "Chain-independent harness for AI smart-contract security benchmarks (detect, patch, exploit)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "openai>=1.50",
    "anthropic>=0.40",
]

[project.scripts]
sec-bench = "sec_bench_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sec_bench_core"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sec_bench_core"]

[tool.ruff.format]
quote-style = "double"
